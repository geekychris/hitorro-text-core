language: en-US

tone_instructions: >
  Be concise and pragmatic. This module has NLP / retrieval code — flag correctness of language handling and model resource management.

early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "`@coderabbitai` summary"
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: "`@coderabbitai` title"
  sequence_diagrams: true
  collapse_walkthrough: false
  changed_files_summary: true
  poem: false
  suggested_labels: true
  suggested_reviewers: false
  related_issues: true
  related_prs: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/*.md"
    - "!**/target/**"
  path_instructions:
    - path: "**/*"
      instructions: >
        Flag correctness, concurrency, resource-leak,
        security, and performance issues aggressively. When a change appears to
        alter an existing architectural pattern or introduce new shared/stateful
        infrastructure, call that out explicitly as an "architecture" concern
        rather than a routine style comment.
        In addition to routine correctness review, explicitly call out:
        (1) Security-relevant concerns — injection risks (e.g. building
        glob/regex/SQL/shell patterns from variable input), credential or
        secret handling, unsafe deserialization, missing input validation,
        or SSRF/timeout gaps in network/process-execution code.
        (2) Performance/concurrency concerns — thread-safety of shared
        mutable state, blocking calls inside virtual threads, unbounded
        resource usage, and missing cancellation/cleanup on
        timeout/failure paths.
        (3) Architectural concerns — new stateful/shared infrastructure,
        changes to existing module contracts, or new coupling between
        packages that weren't previously related. When such a change is
        found, describe the concern and suggest what should be verified
        or documented.
        Module-specific additions for this repository:
        This module contains NLP, retrieval, or text-analysis code. In addition to the standard checks, watch for: (1) silent language defaulting — code that falls back to English when the caller's language wasn't specified is easy to introduce and hard to notice in review; (2) thread-safety of NLP model instances — OpenNLP's *ME classes are generally not thread-safe, so any singleton/shared use needs either per-thread instances or explicit synchronization; (3) memory footprint of loaded models — flag any change that adds a new model load path without a cache or explicit release; (4) tokenizer/segmenter output shape changes that would break downstream projections; (5) similarity/scoring changes that alter retrieval quality — call out that the change needs offline eval before merge; (6) handling of MLS (multi-lingual string) envelopes — code that only reads `.text` without checking `.lang` is a common bug source.
  abort_on_close: true
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
